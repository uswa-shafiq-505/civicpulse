[project]
name = "civicpulse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends(...) in argument defaults is FastAPI's own idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
"scripts/seed.py" = ["E501"]  # seed data rows are tuples; wrapping them hurts readability more than it helps

[tool.pytest.ini_options]
testpaths = ["tests"]
