apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_USER: civicpulse
  POSTGRES_PASSWORD: civicpulse
  POSTGRES_DB: civicpulse
  DATABASE_URL: postgresql+psycopg://civicpulse:civicpulse@postgres:5432/civicpulse
  REDIS_URL: redis://redis:6379/0
  LLM_API_KEY: unused-in-dev