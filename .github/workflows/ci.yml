name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app/ scripts/
      - name: Mypy
        working-directory: backend
        run: mypy app/ --ignore-missing-imports
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings=0
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: backend
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=65

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npx vitest run

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t civicpulse-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci ./frontend

  scan:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t civicpulse-backend:ci ./backend
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: civicpulse-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Validate manifests
        run: ./kustomize build k8s/overlays/prod | ./kubeconform -strict -ignore-missing-schemas -summary

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Bring up the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ready; then exit 0; fi
            sleep 2
          done
          echo "backend never became ready" && exit 1
      - name: Submit and verify a complaint
        run: |
          RESP=$(curl -sf -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Water pipe burst near Street 12, flooding fast.","location":"Street 12"}')
          echo "$RESP" | grep -q '"category"'
      - name: Verify stats cache MISS then HIT
        run: |
          curl -sD - http://localhost:8000/api/stats -o /dev/null | grep -i "x-cache: MISS"
          curl -sD - http://localhost:8000/api/stats -o /dev/null | grep -i "x-cache: HIT"
      - name: Tear down
        if: always()
        run: docker compose down -v